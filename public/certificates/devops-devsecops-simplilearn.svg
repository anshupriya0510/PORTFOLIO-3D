<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSimpli" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfdfe"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bgSimpli)"/>
  <!-- Elegant Gold/Navy Border Frame -->
  <rect x="35" y="35" width="930" height="630" fill="none" stroke="#e2a03f" stroke-width="3"/>
  <rect x="45" y="45" width="910" height="610" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Right Navy Decorative Stripes -->
  <rect x="750" y="35" width="90" height="630" fill="#0f172a"/>
  <rect x="850" y="35" width="20" height="630" fill="#0284c7"/>

  <!-- Logo Top Left -->
  <g transform="translate(80, 80)">
    <text font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#ea580c">simplilearn</text>
    <text x="145" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#0284c7">Skill<tspan fill="#ea580c">UP</tspan></text>
  </g>

  <!-- Title -->
  <g transform="translate(80, 160)">
    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748b" letter-spacing="3">CERTIFICATE OF</text>
    <text y="42" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#1e293b" letter-spacing="2">COMPLETION</text>
  </g>

  <!-- Name -->
  <g transform="translate(80, 290)">
    <text font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#0f172a">Anshu Priya</text>
    <line x1="0" y1="12" x2="520" y2="12" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1.5"/>
  </g>

  <!-- Course description -->
  <g transform="translate(80, 345)">
    <text font-family="Arial, sans-serif" font-size="14" fill="#64748b">has successfully completed the online course:</text>
    <text y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Introduction to DevOps and DevSecOps</text>
    <text y="75" font-family="Arial, sans-serif" font-size="13" fill="#64748b">This professional has demonstrated initiative and a</text>
    <text y="95" font-family="Arial, sans-serif" font-size="13" fill="#64748b">commitment to deepening their skills and advancing</text>
    <text y="115" font-family="Arial, sans-serif" font-size="13" fill="#64748b">their career. Well done!</text>
  </g>

  <!-- Date & Code -->
  <g transform="translate(80, 560)">
    <text font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">14<tspan font-size="11" dy="-6">th</tspan><tspan font-size="16" dy="6"> August 2026</tspan></text>
    <text y="25" font-family="monospace" font-size="14" font-weight="600" fill="#475569">Certificate code : 10599690</text>
  </g>

  <!-- Signature -->
  <g transform="translate(560, 560)">
    <path d="M0,-10 C20,-30 40,0 60,-20 C80,-10 90,-40 100,-15" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <text y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Krishna Kumar</text>
    <text y="38" font-family="Arial, sans-serif" font-size="11" fill="#64748b">CEO, Simplilearn</text>
  </g>

  <!-- Badge Emblem -->
  <g transform="translate(795, 530)">
    <circle cx="0" cy="0" r="55" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="45" fill="white"/>
    <rect x="-15" y="-20" width="8" height="40" fill="#ea580c" rx="2"/>
    <rect x="7" y="-20" width="8" height="40" fill="#ea580c" rx="2"/>
    <circle cx="-1" cy="0" r="4" fill="#ea580c"/>
  </g>
</svg>
