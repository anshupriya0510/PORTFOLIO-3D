<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="teliportBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#teliportBg)"/>
  <rect x="30" y="30" width="940" height="640" fill="none" stroke="#6366f1" stroke-width="2" rx="12"/>
  <rect x="40" y="40" width="920" height="620" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" rx="8"/>

  <!-- Top Logo / Organization -->
  <g transform="translate(500, 110)" text-anchor="middle">
    <text font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#a5b4fc" letter-spacing="4">TATA ELXSI</text>
    <text y="30" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="3">TELIPORT SEASON 3</text>
  </g>

  <!-- Award Heading -->
  <g transform="translate(500, 240)" text-anchor="middle">
    <text font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">CERTIFICATE OF PARTICIPATION</text>
    <text y="65" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff">Anshu Priya</text>
  </g>

  <!-- Details -->
  <g transform="translate(500, 390)" text-anchor="middle">
    <text font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">Participated as part of <tspan font-weight="bold" fill="#38bdf8">Team Logic Loopers</tspan></text>
    <text y="35" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Representing Sarala Birla University, Ranchi</text>
  </g>

  <!-- Date Footer -->
  <g transform="translate(500, 560)" text-anchor="middle">
    <text font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">June 15, 2026</text>
    <text y="24" font-family="Arial, sans-serif" font-size="12" fill="#64748b" letter-spacing="2">NATIONAL INNOVATION CHALLENGE</text>
  </g>
</svg>
