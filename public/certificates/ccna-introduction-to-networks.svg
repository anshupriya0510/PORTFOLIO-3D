<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCisco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bgCisco)"/>
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="35" y="35" width="930" height="630" fill="none" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Top Left Cisco Logo -->
  <g transform="translate(70, 75)">
    <text font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Cisco</text>
    <text y="22" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#0f172a">Networking</text>
    <text y="42" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#0f172a">Academy</text>
  </g>

  <!-- Waves Decoration Top Right -->
  <g opacity="0.3" stroke="#0284c7" stroke-width="1" fill="none" transform="translate(450, 40)">
    <path d="M0,80 Q200,-20 450,60"/>
    <path d="M0,90 Q200,-10 450,70"/>
    <path d="M0,100 Q200,0 450,80"/>
    <path d="M0,110 Q200,10 450,90"/>
  </g>

  <!-- Main Award Text -->
  <text x="500" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">This certificate is awarded to</text>
  <text x="500" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#0369a1">Anshu Priya</text>
  <text x="500" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">for successfully completing</text>

  <text x="500" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#0284c7">CCNA: Introduction to Networks</text>
  
  <text x="500" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">offered by <tspan font-weight="bold" fill="#0f172a">Sarala Birla University, Ranchi, Jharkhand</tspan></text>
  <text x="500" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">through the Cisco Networking Academy program.</text>

  <line x1="80" y1="525" x2="920" y2="525" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Instructor / Bottom Left -->
  <g transform="translate(80, 565)">
    <text font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Dr. Pankaj K. Goswami</text>
    <text y="22" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Instructor</text>
    <text y="42" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Sarala Birla University, Ranchi, Jharkhand</text>
  </g>

  <!-- Date / Bottom Right -->
  <g transform="translate(920, 575)" text-anchor="end">
    <text font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">30 May 2026</text>
    <text y="22" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Completion Date</text>
  </g>

  <!-- Cert ID footer -->
  <text x="500" y="650" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">Cert ID: 20a0e9d3-ef29-4e58-b852-384ffb6a2f72</text>
</svg>
