<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <pattern id="lines" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 L 20 10" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1000" height="700" fill="url(#bg)"/>
  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#007cc3" stroke-width="3" rx="8"/>
  <rect x="28" y="28" width="944" height="644" fill="none" stroke="#e2e8f0" stroke-width="1" rx="6"/>

  <!-- Top Logo -->
  <g transform="translate(500, 75)" text-anchor="middle">
    <text font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#007cc3" letter-spacing="1">Infosys</text>
    <text y="22" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#475569" letter-spacing="2">Navigate your next</text>
  </g>

  <!-- Title Section with side hashes -->
  <g transform="translate(500, 180)" text-anchor="middle">
    <line x1="-380" y1="-8" x2="-260" y2="-8" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,4"/>
    <text font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0284c7" letter-spacing="2">COURSE COMPLETION CERTIFICATE</text>
    <line x1="260" y1="-8" x2="380" y2="-8" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,4"/>
  </g>

  <text x="500" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">The certificate is awarded to</text>
  <text x="500" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#007cc3">Anshu Priya</text>

  <text x="500" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">for successfully completing the course</text>
  <text x="500" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">AWS Certified Developer - Associate Certification</text>
  <text x="500" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">on May 26, 2026</text>

  <!-- Infosys Springboard Logo -->
  <g transform="translate(500, 480)" text-anchor="middle">
    <text font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#007cc3">Infosys <tspan fill="#ea580c">Springboard</tspan></text>
    <text y="35" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#e11d48">Congratulations! You make us proud!</text>
  </g>

  <!-- QR Code Mock & Verification Box -->
  <g transform="translate(70, 480)">
    <rect width="130" height="130" fill="#0f172a" rx="6"/>
    <!-- Mock QR pattern -->
    <rect x="10" y="10" width="35" height="35" fill="white"/>
    <rect x="17" y="17" width="21" height="21" fill="#0f172a"/>
    <rect x="85" y="10" width="35" height="35" fill="white"/>
    <rect x="92" y="17" width="21" height="21" fill="#0f172a"/>
    <rect x="10" y="85" width="35" height="35" fill="white"/>
    <rect x="17" y="92" width="21" height="21" fill="#0f172a"/>
    <circle cx="65" cy="65" r="10" fill="white"/>
    <text x="0" y="150" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Issued on: Wednesday, May 27, 2026</text>
    <text x="0" y="165" font-family="Arial, sans-serif" font-size="10" fill="#0284c7">Verify: https://verify.onwingspan.com</text>
  </g>

  <!-- Signatory -->
  <g transform="translate(850, 580)" text-anchor="middle">
    <path d="M-80,-10 C-40,-35 -20,5 20,-20 C50,-35 70,0 90,-10" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
    <text y="15" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Satheesha B. Nanjappa</text>
    <text y="30" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Senior Vice President and Head</text>
    <text y="44" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Education, Training and Assessment</text>
    <text y="58" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#475569">Infosys Limited</text>
  </g>
</svg>
