<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="awsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0fdf4"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#awsBg)"/>

  <!-- Top Header -->
  <g transform="translate(100, 140)">
    <text font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#0f172a">AWS Training &amp; Certification</text>
    <text y="30" font-family="Arial, sans-serif" font-size="20" fill="#334155">Completion Certificate</text>
  </g>

  <!-- Big Title -->
  <g transform="translate(100, 260)">
    <text font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#0f172a">AWS Cloud Practitioner</text>
    <text y="54" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#0f172a">Essentials</text>
    <text y="105" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">Completed: July 20, 2026</text>
  </g>

  <!-- Awarded to -->
  <g transform="translate(100, 470)">
    <text font-family="Arial, sans-serif" font-size="16" fill="#64748b">Awarded to</text>
    <text y="35" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0f172a">Anshu Priya</text>
  </g>

  <!-- Signature -->
  <g transform="translate(100, 600)">
    <path d="M0,-15 C20,-40 35,5 60,-25 C85,-40 100,0 125,-10" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <text y="18" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Michelle Vaz</text>
    <text y="36" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Director, AWS Training &amp; Certification</text>
  </g>

  <!-- AWS Logo Bottom Right -->
  <g transform="translate(750, 600)">
    <text font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#0f172a">aws</text>
    <!-- Smile arrow -->
    <path d="M-8,12 Q35,32 80,12" fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round"/>
    <path d="M72,16 L83,11 L78,24 Z" fill="#ff9900"/>
  </g>
</svg>
